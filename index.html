<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05080c" />
  <meta name="description" content="Suivi des interventions de rotation locative — Coup 2 Pouce 33" />
  <title>Suivi Rotation — Coup 2 Pouce 33</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-glow" aria-hidden="true"></div>
    <div class="header-inner">
      <button type="button" id="btn-back" class="btn-icon hidden" aria-label="Retour">←</button>
      <img src="assets/logo.png" alt="Coup 2 Pouce 33" class="header-logo" width="44" height="44" />
      <div class="header-titles">
        <h1 id="page-title">Suivi Rotation</h1>
        <p id="page-subtitle" class="subtitle brand-slogan">Le coup de main qu'il vous faut</p>
      </div>
      <button type="button" id="btn-menu" class="btn-icon" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
    <p class="brand-tagline" aria-hidden="true">
      <span class="brand-name">Coup 2 Pouce 33</span>
      <span class="brand-sep">·</span>
      <span class="brand-services">plomberie · chauffage · rénovation · sanitaire</span>
    </p>
    <nav id="main-nav" class="main-nav hidden" aria-label="Navigation">
      <button type="button" data-view="home" class="nav-link active">Logements</button>
      <button type="button" data-view="synthese" class="nav-link">Synthèse</button>
      <button type="button" id="btn-export" class="nav-link">Exporter JSON</button>
      <button type="button" id="btn-import" class="nav-link">Importer JSON</button>
      <button type="button" id="btn-reset" class="nav-link danger">Réinitialiser</button>
    </nav>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="app-footer">
    <div class="footer-corner" aria-hidden="true"></div>
    <p class="footer-brand">
      <strong class="neon-text">Coup 2 Pouce 33</strong>
      <em class="gold-slogan">Le coup de main qu'il vous faut</em>
    </p>
    <p class="footer-meta">Suivi Rotation · interventions locatives</p>
  </footer>

  <input type="file" id="import-file" accept="application/json,.json" class="hidden" />

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
