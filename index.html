<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a4d6d" />
  <meta name="description" content="Suivi des interventions de rotation locative — 60 logements" />
  <title>Suivi Rotation — Interventions</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button type="button" id="btn-back" class="btn-icon hidden" aria-label="Retour">←</button>
      <div class="header-titles">
        <h1 id="page-title">Suivi Rotation</h1>
        <p id="page-subtitle" class="subtitle">60 logements · Plomberie · Chauffage · Sanitaire</p>
      </div>
      <button type="button" id="btn-menu" class="btn-icon" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
    <nav id="main-nav" class="main-nav hidden" aria-label="Navigation">
      <button type="button" data-view="home" class="nav-link active">Logements</button>
      <button type="button" data-view="synthese" class="nav-link">Synthèse</button>
      <button type="button" id="btn-export" class="nav-link">Exporter JSON</button>
      <button type="button" id="btn-import" class="nav-link">Importer JSON</button>
      <button type="button" id="btn-reset" class="nav-link danger">Réinitialiser</button>
    </nav>
  </header>

  <main id="app" class="app-main"></main>

  <input type="file" id="import-file" accept="application/json,.json" class="hidden" />

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
